<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyntaxWear - Sneakers Online</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="/css/componentes/header.css">
</head>
<body>
    <!-- Topo da página com logo e menu -->
    <header class="header">

        <h1 class="logo">
            <a href="/" title="SyntaxWear - Sneakers Online">
                <img src="./images/logo/logo.svg" alt="SyntaxWear - Sneakers Online">
            </a>
        </h1>

        <nav class="nav-center" aria-label="Main Categories">
            <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>
        </nav>

        <nav class="nav-right" aria-label="Quick Access">
            <ul>
                <li><a href="#">Nossas Lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="My Account">
                        <img src="./images/icons/user.svg" alt="My Account">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Help">
                        <img src="./images/icons/help.svg" alt="Help">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Bag">
                        <img src="./images/icons/bag.svg" alt="Bag">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Área principal do conteúdo -->
    <main>
        <!-- Banner promocional de destaque -->
        <section class="hero"></section>
        
        <!-- Lista de categorias de produtos -->
        <section class="categories"></section>
        
        <!-- Vitrine de produtos populares -->
        <section class="featured-products"></section>
    </main>

    <!-- Rodapé com informações e links -->
    <footer class="site-footer"></footer>
</body>
</html>
